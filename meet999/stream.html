<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансляция - Meet 999</title>
    <meta name="description" content="Прямая трансляция еженедельной встречи разработчиков">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Yandex.Metrika counter MVP -->
    <script type="text/javascript" >
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();
       for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
       k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
       (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
       ym(99999999, "init", { clickmap:true, trackLinks:true, accurateTrackBounce:true });
    </script>
</head>
<body style="overflow: hidden; background: #000;">

    <div class="stream-layout">
        
        <!-- Video Area -->
        <div class="stream-main">
            <!-- Offline Placeholder (Hide/Show via JS in future, for now iframe will handle its inner state or we just show iframe) -->
            <!-- <div class="stream-offline" id="stream-offline">
                <h2>Трансляция сейчас оффлайн</h2>
                <p>Следующий эфир 16 апреля в 19:00</p>
                <a href="index.html" class="btn btn-outline" style="margin-top: 20px;">На главную</a>
            </div> -->

            <div class="stream-video" id="stream-video">
                <!-- Hardcoded per spec -->
                <iframe src="https://kinescope.io/embed/0cyPZsP6hogJQZ2bJAWwWy" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;" frameborder="0" allowfullscreen></iframe>
            </div>

            <div class="stream-controls">
                <div class="stream-stats">
                    <div class="stream-stat-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span id="viewers-count">124</span> <!-- placeholder for layout -->
                    </div>
                    <div class="stream-stat-item" style="color: var(--accent-color);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                        <span id="like-count">0</span>
                    </div>
                </div>

                <div class="stream-actions">
                    <button class="applause-btn" id="applause-btn">👏</button>
                    <button class="toggle-chat-btn" id="toggle-chat">Закрыть чат</button>
                    <a href="index.html" class="btn btn-outline" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">На главную</a>
                </div>
            </div>
        </div>

        <!-- Chat Sidebar -->
        <div class="stream-sidebar" id="stream-sidebar">
            <div class="chat-window" style="border-radius: 0; border-left: 1px solid rgba(255,255,255,0.1); background: #141824;">
                <div style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 600; text-align: center; display: flex; justify-content: space-between; align-items: center;">
                    <span>Чат трансляции</span>
                    
                    <button class="user-profile-btn" id="btn-profile" style="padding: 4px;">
                        <div class="avatar" id="header-avatar" style="width: 28px; height: 28px; font-size: 11px;"></div>
                    </button>
                </div>
                
                <div class="chat-messages" id="chat-messages">
                    <div style="text-align:center; padding: 20px; color: var(--text-secondary)">Загрузка сообщений...</div>
                </div>
                
                <div class="chat-input-area" style="background: #0f121b; border-top: 1px solid rgba(255,255,255,0.05);">
                    <div class="chat-input-state" id="chat-input-state">
                        <span id="chat-state-val">Ответ: ...</span>
                        <button class="modal-close" id="cancel-chat-state" style="position: static; width:20px; height:20px; font-size:16px;">&times;</button>
                    </div>
                    <div class="chat-input-row">
                        <textarea id="chat-input" class="chat-textarea" placeholder="Написать сообщение..."></textarea>
                        <button id="chat-send-btn" class="chat-send-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Modals Need to be available on Stream Page too -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2 class="modal-title">Вход</h2>
            <div style="text-align: center; margin-bottom: 20px; color: var(--text-secondary)">Войдите, чтобы писать в чат</div>
            <button class="btn btn-outline" style="width:100%; display:flex; gap:10px; justify-content:center" id="btn-google-auth">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Продолжить с Google
            </button>
            <div style="text-align: center; margin-top: 10px;">
                <a href="index.html" style="font-size: 14px; text-decoration: underline;">Регистрация по Email (на главной)</a>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2 class="modal-title">Настройки профиля</h2>
            
            <div class="form-group">
                <label class="form-label">Никнейм (уникальный)</label>
                <input type="text" id="profile-nickname" class="form-control">
            </div>
            
            <div class="form-group">
                <label class="form-label">Аватарка (Файл .jpg, .png)</label>
                <input type="file" id="profile-avatar-file" class="form-control" accept="image/*">
            </div>

            <div class="form-group">
                <label class="form-label">Цвет профиля</label>
                <div class="color-palette" id="profile-colors"></div>
            </div>

            <div style="margin-top: 30px;">
                <button class="btn btn-primary" id="btn-save-profile" style="width:100%">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Context Menu for Chat -->
    <div class="context-menu" id="chat-context-menu">
        <div class="context-menu-item" id="ctx-reply">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"></polyline><path d="M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>
            Reply
        </div>
        <div class="context-menu-item" id="ctx-edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            Edit
        </div>
        <div class="context-menu-item danger" id="ctx-delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            Delete
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script type="module">
        import { currentUserProfile } from './js/auth.js';
        import { openModal } from './js/ui.js';
        
        document.addEventListener('DOMContentLoaded', () => {
             // Since stream page has simpler header, handle profile access
             document.getElementById('btn-profile')?.addEventListener('click', () => {
                 if(currentUserProfile) {
                     // populated via main.js listener which works across pages
                 } else {
                     openModal('auth-modal');
                 }
             });

             // The chat text area needs auth check
             const input = document.getElementById('chat-input');
             input.addEventListener('focus', () => {
                 if(!currentUserProfile) {
                     input.blur();
                     openModal('auth-modal');
                 }
             });
        });
    </script>
</body>
</html>
