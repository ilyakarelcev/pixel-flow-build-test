<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eccentric Фильтр мата</title>
<style>
  :root {
    --bg: #08111f;
    --ink: #f7f3e9;
    --muted: #9eabc3;
    --muted-2: #687690;
    --line: rgba(255, 255, 255, .12);
    --panel: rgba(14, 25, 43, .86);
    --blue: #243f74;
    --blue-bright: #3b6fc8;
    --yellow: #f5ad17;
    --yellow-2: #ffd165;
    --good: #54d6a1;
    --good-bg: rgba(84, 214, 161, .13);
    --bad: #ff725d;
    --bad-bg: rgba(255, 114, 93, .15);
    --shadow: 0 24px 80px rgba(0, 0, 0, .38);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    line-height: 1.45;
    letter-spacing: 0;
    background:
      linear-gradient(135deg, rgba(36, 63, 116, .78) 0%, rgba(8, 17, 31, 0) 42%),
      linear-gradient(180deg, #0a1424 0%, #08111f 48%, #050a12 100%);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,.95), rgba(0,0,0,.18));
  }
  body::after {
    content: "#  *  .  /  @  3  1  $  _  -  +  x  y  a  ё  ш";
    position: fixed;
    right: -120px;
    top: 18vh;
    width: 520px;
    transform: rotate(90deg);
    color: rgba(255, 255, 255, .035);
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 18px;
    white-space: nowrap;
    pointer-events: none;
  }

  main {
    position: relative;
    width: min(1040px, calc(100% - 32px));
    margin: 0 auto;
    padding: 22px 0 76px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 10px 0 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 14px;
  }
  .brand-mark {
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    border-radius: 5px;
    background: linear-gradient(145deg, var(--yellow-2), var(--yellow) 68%, #d98b00);
    transform: rotate(-7deg);
    box-shadow: 0 14px 24px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .brand:hover .brand-mark,
  .brand-mark:hover {
    transform: rotate(0deg) scale(1.03);
    box-shadow: 0 16px 30px rgba(245, 173, 23, .25), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .brand-title {
    display: grid;
    gap: 1px;
    color: var(--ink);
    font-size: 16px;
    line-height: .94;
    font-weight: 950;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .brand-title span:nth-child(n+2) { color: var(--yellow); }
  .download {
    display: inline-flex;
    align-items: center;
    min-height: 38px;
    padding: 9px 14px;
    border-radius: 999px;
    color: #15100a;
    background: var(--yellow);
    text-decoration: none;
    font-size: 13px;
    font-weight: 850;
    box-shadow: 0 10px 30px rgba(245, 173, 23, .28);
    transition: transform .14s ease, filter .14s ease;
  }
  .download:hover { transform: translateY(-1px); filter: brightness(1.08); }

  .panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
  }
  .scanner-panel {
    position: relative;
    overflow: hidden;
    padding: 20px;
  }
  .scanner-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-top: 3px solid var(--yellow);
    pointer-events: none;
  }
  .panel-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .eyebrow {
    margin: 0 0 3px;
    color: var(--yellow-2);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  h1,
  h2 {
    margin: 0;
    color: var(--ink);
    font-size: 28px;
    line-height: 1.06;
    letter-spacing: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  textarea,
  input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--ink);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px;
    outline: none;
    background: rgba(5, 10, 18, .68);
    transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
  }
  textarea {
    display: block;
    min-height: 230px;
    padding: 16px;
    resize: none;
    overflow: hidden;
    overflow-wrap: anywhere;
    font-size: 17px;
  }
  input[type="text"] { min-height: 44px; padding: 11px 12px; }
  textarea::placeholder,
  input[type="text"]::placeholder { color: #65748f; }
  textarea:focus,
  input[type="text"]:focus {
    border-color: rgba(245, 173, 23, .68);
    background: rgba(5, 10, 18, .86);
    box-shadow: 0 0 0 3px rgba(245, 173, 23, .12);
  }

  button.primary,
  button.secondary {
    min-height: 38px;
    border-radius: 8px;
    font: inherit;
    font-weight: 900;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease, border-color .12s ease;
  }
  button.primary {
    border: 0;
    color: #120d07;
    background: var(--yellow);
  }
  button.secondary {
    border: 1px solid rgba(255,255,255,.14);
    color: #dce5f7;
    background: rgba(255,255,255,.045);
    padding: 8px 12px;
  }
  button.primary:hover,
  button.secondary:hover { transform: translateY(-1px); filter: brightness(1.08); }
  button.secondary:hover { border-color: rgba(245, 173, 23, .6); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .chips-label {
    width: 100%;
    margin-bottom: -1px;
    color: var(--muted-2);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .chip {
    min-height: 32px;
    padding: 5px 10px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 7px;
    color: #dce5f7;
    background: rgba(255,255,255,.045);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, color .12s ease, background .12s ease;
  }
  .chip:hover {
    transform: translateY(-1px);
    border-color: rgba(245, 173, 23, .7);
    color: #fff3cf;
    background: rgba(245, 173, 23, .12);
  }
  #live-result { margin-top: 16px; }

  .scan-empty {
    display: grid;
    min-height: 180px;
    place-items: center;
    border: 1px dashed rgba(255,255,255,.14);
    border-radius: 8px;
    color: var(--muted);
    background: rgba(255,255,255,.026);
    text-align: center;
  }
  .scan-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .verdict {
    display: inline-flex;
    align-items: center;
    min-height: 38px;
    padding: 8px 12px;
    border-radius: 7px;
    font-weight: 850;
    font-size: 14px;
  }
  .verdict.good {
    color: #d9ffed;
    background: var(--good-bg);
    border: 1px solid rgba(84, 214, 161, .35);
  }
  .verdict.bad {
    color: #ffe5df;
    background: var(--bad-bg);
    border: 1px solid rgba(255, 114, 93, .36);
  }
  .scan-count {
    color: var(--muted);
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
  }
  .scan-flow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .flow-step {
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    overflow: hidden;
    background: rgba(255,255,255,.035);
  }
  .flow-label {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 10px 0;
    color: var(--muted-2);
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .cmp-text {
    min-width: 0;
    min-height: 42px;
    max-height: 330px;
    overflow: auto;
    padding: 10px;
    color: #f7f3e9;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-size: 15px;
  }
  .censored {
    color: var(--yellow-2);
    font-weight: 850;
    letter-spacing: .02em;
  }
  mark.hit {
    padding: 1px 3px;
    border-radius: 4px;
    color: #150b08;
    background: var(--bad);
    font-weight: 900;
    cursor: help;
  }
  code {
    color: #dce5f7;
    background: rgba(255,255,255,.055);
    border-radius: 5px;
    padding: 1px 5px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
  }
  .muted { color: var(--muted); }
  .row { margin: 7px 0; }
  .row.small { color: var(--muted); font-size: 12px; }
  .label { color: var(--muted-2); }
  details.debug {
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
  }
  details.debug summary {
    width: fit-content;
    cursor: pointer;
    color: var(--muted);
  }

  .tests-panel {
    margin-top: 18px;
    padding: 18px;
  }
  .tests-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .tests-controls label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .tests-controls input { accent-color: var(--yellow); }
  #tests-summary {
    margin: 14px 0 6px;
    font-size: 18px;
    font-weight: 900;
  }
  .tests-good { color: var(--good); }
  .tests-bad { color: var(--bad); }
  .table-wrap {
    overflow: auto;
    border-radius: 8px;
  }
  table {
    display: none;
    width: 100%;
    min-width: 720px;
    margin-top: 8px;
    border-collapse: collapse;
    font-size: 13px;
  }
  th,
  td {
    padding: 9px 10px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    text-align: left;
    vertical-align: top;
  }
  th {
    color: var(--muted-2);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  tr.fail td { background: rgba(255, 114, 93, .09); }
  tr.ok td:first-child { color: var(--good); }
  tr.fail td:first-child { color: var(--bad); }
  td .note { color: var(--muted); font-size: 12px; }

  .chat-widget {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 20;
  }
  .chat-nudge {
    position: absolute;
    right: 76px;
    bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--yellow-2);
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
    animation: nudge 1.25s ease-in-out infinite;
  }
  .chat-nudge::after {
    content: "→";
    font-size: 24px;
    line-height: 1;
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); opacity: .78; }
    50% { transform: translateX(8px); opacity: 1; }
  }
  .chat-fab {
    display: grid;
    width: 64px;
    height: 64px;
    place-items: center;
    border: 0;
    border-radius: 50%;
    color: #171006;
    background: var(--yellow);
    box-shadow: 0 18px 52px rgba(245, 173, 23, .34);
    font-size: 28px;
    font-weight: 950;
    cursor: pointer;
    transition: transform .16s ease, filter .16s ease;
  }
  .chat-fab:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.05); }
  .chat-window {
    position: absolute;
    right: 0;
    bottom: 76px;
    width: min(420px, calc(100vw - 28px));
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(12, 22, 38, .96);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    transform-origin: 88% 100%;
    transition: transform .16s ease, opacity .16s ease, visibility .16s ease;
  }
  .chat-widget:not(.open) .chat-window {
    visibility: hidden;
    opacity: 0;
    transform: translateY(12px) scale(.96);
    pointer-events: none;
  }
  .chat-widget.open .chat-nudge { display: none; }
  .chat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .chat-head strong {
    color: var(--ink);
    font-size: 18px;
  }
  .chat-close {
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 8px;
    color: var(--ink);
    background: rgba(255,255,255,.045);
    cursor: pointer;
  }
  #chat-list {
    height: 330px;
    overflow-y: auto;
    padding: 12px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.018)),
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(255,255,255,.025) 38px 39px);
    font-size: 14px;
  }
  .chat-empty {
    display: grid;
    min-height: 100%;
    place-items: center;
    color: var(--muted);
    text-align: center;
  }
  .msg {
    display: flex;
    justify-content: flex-end;
    margin: 8px 0;
  }
  .msg-inner { max-width: 88%; }
  .msg .nick {
    margin: 0 4px 3px 0;
    color: var(--muted-2);
    font-size: 11px;
    text-align: right;
  }
  .msg .bubble {
    padding: 9px 12px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px 8px 2px 8px;
    color: #f8fbff;
    background: linear-gradient(135deg, var(--blue-bright), #244a89);
    word-break: break-word;
    cursor: default;
  }
  .msg.filtered .bubble {
    color: #201302;
    background: linear-gradient(135deg, var(--yellow-2), var(--yellow));
  }
  .msg .flag {
    display: block;
    margin: 4px 4px 0 0;
    color: var(--yellow-2);
    font-size: 11px;
    text-align: right;
  }
  .chat-row {
    display: grid;
    grid-template-columns: 1fr 46px;
    gap: 8px;
    margin-top: 10px;
  }
  .chat-row .primary { min-height: 44px; }

  footer {
    margin-top: 20px;
    color: var(--muted-2);
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 720px) {
    body { overflow-x: hidden; }
    main { width: min(100% - 22px, 1040px); padding-top: 12px; padding-bottom: 92px; }
    .topbar { align-items: flex-start; flex-direction: column; padding-bottom: 16px; }
    .brand-title { font-size: 15px; }
    h1, h2 { font-size: 24px; }
    .panel-head { align-items: flex-start; flex-direction: column; }
    .toolbar { justify-content: flex-start; width: 100%; }
    .scanner-panel,
    .tests-panel { padding: 14px; }
    textarea { min-height: 250px; font-size: 15px; }
    .scan-summary { align-items: flex-start; flex-direction: column; }
    .scan-flow { grid-template-columns: 1fr; }
    .flow-label { display: block; }
    .flow-label span { display: block; }
    .flow-label span + span { margin-top: 3px; }
    .cmp-text { max-height: 280px; }
    .download { width: fit-content; }
    .chat-widget { right: 12px; bottom: 12px; }
    .chat-fab { width: 58px; height: 58px; }
    .chat-nudge {
      right: 66px;
      bottom: 15px;
      max-width: calc(100vw - 96px);
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }
    .chat-window {
      position: fixed;
      inset: auto 10px 82px 10px;
      width: auto;
      max-height: calc(100vh - 102px);
    }
    #chat-list { height: min(360px, calc(100vh - 240px)); }
    table { min-width: 660px; }
  }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <div class="brand" aria-label="Eccentric Фильтр мата">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-title">
        <span>Eccentric</span>
        <span>Фильтр</span>
        <span>мата</span>
      </span>
    </div>
    <a class="download" href="ProfanityFilter-Unity.zip" download
       title="C#-порт, словари и тесты. Распаковать в Assets.">Скачать Unity asset</a>
  </header>

  <section class="panel scanner-panel" aria-labelledby="scanner-title">
    <div class="panel-head">
      <div>
        <p class="eyebrow">сканер</p>
        <h1 id="scanner-title">Проверка текста</h1>
      </div>
      <div class="toolbar">
        <button id="clear-input" class="secondary" type="button">Очистить</button>
      </div>
    </div>

    <textarea id="live-input" rows="8" wrap="soft"
      placeholder="Вставь чат-лог или отдельную фразу..."></textarea>

    <div class="chips" id="chips">
      <span class="chips-label">готовые атаки</span>
      <button class="chip" data-text="б л я д ь">б л я д ь</button>
      <button class="chip" data-text="cyka blyat">cyka blyat</button>
      <button class="chip" data-text="пи3дец">пи3дец</button>
      <button class="chip" data-text="бл*дь">бл*дь</button>
      <button class="chip" data-text="иди нах">иди нах</button>
      <button class="chip" data-text="3.14здец">3.14здец</button>
      <button class="chip" data-text="ТЫ ЧЁ БЛИН">ТЫ ЧЁ БЛИН · чисто</button>
      <button class="chip" data-text="застрахуй команду">застрахуй команду · чисто</button>
    </div>

    <div id="live-result"></div>
  </section>

  <section class="panel tests-panel" aria-labelledby="tests-title">
    <div class="panel-head">
      <div>
        <p class="eyebrow">корпус</p>
        <h2 id="tests-title">Автотесты обходов</h2>
      </div>
    </div>
    <div class="tests-controls">
      <button id="tests-run" class="primary">Прогнать тесты</button>
      <label><input type="checkbox" id="tests-show-all"> показать все кейсы</label>
    </div>
    <div id="tests-summary"></div>
    <div class="table-wrap">
      <table id="tests-table">
        <thead>
          <tr><th></th><th>Сообщение</th><th>Ожидали</th><th>Получили</th><th>На экране</th></tr>
        </thead>
        <tbody id="tests-table-body"></tbody>
      </table>
    </div>
  </section>

  <footer>
    Словари: <code>js/data-ru.js</code>, <code>js/data-en.js</code> и остальные языки. Логика фильтра: <code>js/filter.js</code>.
  </footer>
</main>

<section id="chat-widget" class="chat-widget" aria-label="Чат как в игре">
  <div class="chat-nudge">матерись тут</div>
  <div class="chat-window" role="dialog" aria-label="Чат как в игре">
    <div class="chat-head">
      <strong>Чат как в игре</strong>
      <button id="chat-close" class="chat-close" type="button" aria-label="Закрыть чат">×</button>
    </div>
    <div id="chat-list"></div>
    <div class="chat-row">
      <input type="text" id="chat-input" placeholder="Сообщение в чат..." maxlength="200">
      <button id="chat-send" class="primary" title="Отправить">↵</button>
    </div>
  </div>
  <button id="chat-toggle" class="chat-fab" type="button" aria-label="Открыть чат">#</button>
</section>

<script src="js/data-ru.js?v=6"></script>
<script src="js/data-en.js?v=6"></script>
<script src="js/data-de.js?v=6"></script>
<script src="js/data-es.js?v=6"></script>
<script src="js/data-tr.js?v=6"></script>
<script src="js/data-ja.js?v=6"></script>
<script src="js/filter.js?v=6"></script>
<script src="js/tests.js?v=6"></script>
<script src="js/stress-corpus.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
